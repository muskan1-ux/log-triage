spring:
  application:
    name: log-triage
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

openai:
  api-key: ${OPENAI_API_KEY:demo}
  model: gpt-4o-mini

resilience4j:
  circuitbreaker:
    instances:
      logTriage:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

  retry:
    instances:
      logTriage:
        max-attempts: 3
        wait-duration: 500ms

logging:
  level:
    com.logtriage: INFO
